---
name: Release
on:
  push:
    tags: [v*]
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libegl1 libxkbcommon0 libxcb-cursor0 libgl1
          version: 1.0
      - run: make check_translate
      - name: Extract release notes from CHANGELOG.md
        id: release_notes
        run: uv run tools/release_notes.py "$GITHUB_REF_NAME" CHANGELOG.md release-notes.md
          >> "$GITHUB_OUTPUT"
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate release artifacts
        uses: ./.github/actions/artifact-install-smoke
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          args=(
            "$GITHUB_REF_NAME"
            --title "$GITHUB_REF_NAME"
            --notes-file release-notes.md
          )
          if [[ "${{ steps.release_notes.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
